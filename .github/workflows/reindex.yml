# 문서 재색인: 사람이 Actions에서 직접 실행한다.
# 수집과 색인은 수십 초에서 분 단위로 걸리고 OpenAI 비용이 발생하므로 자동 트리거를 두지 않는다.
name: Reindex

on:
  workflow_dispatch:

# 재색인 중 배포가 겹치지 않도록, 그리고 동시 실행되지 않도록 막는다
concurrency:
  group: reindex
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DEPLOY_BUCKET: riido-chat-deploy
  DEPLOY_ROLE_ARN: arn:aws:iam::438546836951:role/riido-chat-github-deploy

jobs:
  reindex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 획득
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 재색인 스크립트 업로드
        run: aws s3 cp scripts/reindex.sh "s3://${DEPLOY_BUCKET}/deploy/reindex.sh"

      - name: 앱 EC2에서 재색인 실행
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "reindex ${GITHUB_SHA::7}" \
            --timeout-seconds 3600 \
            --parameters '{
              "commands": [
                "set -euo pipefail",
                "mkdir -p /opt/riido",
                "aws s3 cp s3://riido-chat-deploy/deploy/reindex.sh /opt/riido/reindex.sh",
                "bash /opt/riido/reindex.sh"
              ],
              "executionTimeout": ["3600"]
            }' \
            --query Command.CommandId --output text)
          echo "CommandId: ${COMMAND_ID}"

          # 수집 40초, 임베딩 142건까지 포함해 최대 30분 대기한다
          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "재색인 실패: ${STATUS}" >&2
            exit 1
          fi
