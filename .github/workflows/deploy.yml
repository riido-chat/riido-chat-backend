# CD: develop 머지 시 이미지를 빌드해 ECR에 올리고 SSM으로 앱 EC2에 배포한다.
# SSH를 쓰지 않으므로 앱 EC2에 인바운드 포트를 열지 않는다.
name: Deploy

on:
  push:
    branches: [develop]

# 배포 도중 취소되면 마이그레이션이 중간에 끊길 수 있으므로 취소하지 않는다
concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC로 임시 AWS 자격증명을 받기 위해 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: riido-chat-api
  DEPLOY_BUCKET: riido-chat-deploy
  DEPLOY_ROLE_ARN: arn:aws:iam::438546836951:role/riido-chat-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 장기 액세스 키 없이 IAM 역할을 인수한다.
      # ARN은 비밀 정보가 아니므로 Secret 대신 직접 지정한다.
      - name: AWS 자격증명 획득
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드와 push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # 배포 스크립트는 레포를 정본으로 삼아 매 배포마다 S3에 올린다.
      # .env는 서버에만 두므로 전송하지 않는다.
      - name: 배포 스크립트 업로드
        run: |
          aws s3 cp scripts/deploy.sh "s3://${DEPLOY_BUCKET}/deploy/deploy.sh"
          aws s3 cp docker-compose.api.prod.yml "s3://${DEPLOY_BUCKET}/deploy/docker-compose.api.prod.yml"

      # SSM으로 앱 EC2에서 스크립트를 내려받아 실행한다
      - name: 앱 EC2 배포
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"mkdir -p /opt/riido\",
              \"aws s3 cp s3://${DEPLOY_BUCKET}/deploy/deploy.sh /opt/riido/deploy.sh\",
              \"aws s3 cp s3://${DEPLOY_BUCKET}/deploy/docker-compose.api.prod.yml /opt/riido/docker-compose.api.prod.yml\",
              \"bash /opt/riido/deploy.sh ${IMAGE_URI}\"
            ]" \
            --query Command.CommandId --output text)
          echo "CommandId: ${COMMAND_ID}"

          # 완료까지 최대 15분 대기 (기본 waiter는 100초라 직접 폴링한다)
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: ${STATUS}" >&2
            exit 1
          fi
