services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: riido-chat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riido}
      POSTGRES_USER: ${POSTGRES_USER:-riido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riido}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: riido-chat-postgres-data-v18

networks:
  default:
    name: riido-chat-network
